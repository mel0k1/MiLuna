name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm grub-pc-bin grub-efi-amd64-bin grub-efi-ia32-bin grub-common xorriso mtools dosfstools

      - name: Install nightly Rust
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup target add x86_64-unknown-none --toolchain nightly

      - name: Build MiLuna.iso
        run: make

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiLuna-iso
          path: MiLuna.iso

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm grub-pc-bin grub-efi-amd64-bin grub-efi-ia32-bin grub-common xorriso mtools dosfstools

      - name: Install nightly Rust
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup target add x86_64-unknown-none --toolchain nightly

      - name: Build MiLuna.iso
        run: make

      - name: Attach ISO to release
        uses: softprops/action-gh-release@v2
        with:
          files: MiLuna.iso
